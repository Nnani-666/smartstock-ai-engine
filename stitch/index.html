<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartStock AI Suite — Premium Editorial Showcase</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:ital,wght@0,500;0,600;0,700;1,500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <style>
    body { font-family: 'Hanken Grotesk', sans-serif; background-color: #101613; color: #edf1ee; }
    .serif { font-family: 'Newsreader', Georgia, serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 md:p-6">

  <!-- Top Editorial Masthead Bar -->
  <header class="w-full max-w-7xl flex flex-wrap items-center justify-between pb-4 border-b border-[#25362f] gap-4">
    <div class="flex items-center gap-3">
      <img src="assets/smartstock-logo.svg" alt="SmartStock" class="w-10 h-10 rounded-lg border border-[#2d453b] object-cover" />
      <div>
        <h1 class="serif text-2xl font-semibold tracking-tight text-[#faf8f5]">SmartStock AI Suite</h1>
        <p class="text-xs text-[#9cb5aa]">Sharma Kirana Retail OS (₹ INR) • Editorial UI ↔ FastAPI &amp; Supabase Engine</p>
      </div>
    </div>

    <div class="flex flex-wrap items-center gap-2.5">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-[#17241f] border border-[#25362f] text-[11px]">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
        <span class="text-emerald-200 mono">Supabase: txpvoqdecsjpmklelxdb</span>
      </div>
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-[#17241f] border border-[#25362f] text-[11px]">
        <span class="w-1.5 h-1.5 rounded-full bg-teal-400"></span>
        <span class="text-teal-200 mono">Stitch: 776996957008142928</span>
      </div>
    </div>
  </header>

  <!-- Screen & Viewport Controls -->
  <div class="w-full max-w-7xl flex flex-col gap-3 py-4">
    <div class="flex flex-wrap items-center justify-between gap-2">
      <div class="flex flex-wrap gap-1.5 text-xs">
        <button onclick="setScreen('screens/01_signin.html')" class="screen-btn px-3 py-1.5 rounded-md bg-[#0f382b] text-[#edf1ee] font-semibold transition cursor-pointer">1. Sign In</button>
        <button onclick="setScreen('screens/02_overview.html')" class="screen-btn px-3 py-1.5 rounded-md bg-[#17221d] text-[#a3b0aa] font-medium hover:text-white transition cursor-pointer">2. Overview</button>
        <button onclick="setScreen('screens/03_inventory.html')" class="screen-btn px-3 py-1.5 rounded-md bg-[#17221d] text-[#a3b0aa] font-medium hover:text-white transition cursor-pointer">3. Inventory</button>
        <button onclick="setScreen('screens/07_sales.html')" class="screen-btn px-3 py-1.5 rounded-md bg-[#17221d] text-[#a3b0aa] font-medium hover:text-white transition cursor-pointer">Sales POS</button>
        <button onclick="setScreen('screens/05_purchase_orders.html')" class="screen-btn px-3 py-1.5 rounded-md bg-[#17221d] text-[#a3b0aa] font-medium hover:text-white transition cursor-pointer">5. Purchase Orders</button>
        <button onclick="setScreen('screens/05_replenishment.html')" class="screen-btn px-3 py-1.5 rounded-md bg-[#17221d] text-[#a3b0aa] font-medium hover:text-white transition cursor-pointer">AI Replenishment</button>
        <button onclick="setScreen('screens/04_forecasts.html')" class="screen-btn px-3 py-1.5 rounded-md bg-[#17221d] text-[#a3b0aa] font-medium hover:text-white transition cursor-pointer">4. Forecasts</button>
        <button onclick="setScreen('screens/08_anomalies.html')" class="screen-btn px-3 py-1.5 rounded-md bg-[#17221d] text-[#a3b0aa] font-medium hover:text-white transition cursor-pointer">Anomalies</button>
        <button onclick="setScreen('screens/09_segmentation.html')" class="screen-btn px-3 py-1.5 rounded-md bg-[#17221d] text-[#a3b0aa] font-medium hover:text-white transition cursor-pointer">Segmentation</button>
        <button onclick="setScreen('screens/10_assistant.html')" class="screen-btn px-3 py-1.5 rounded-md bg-[#17221d] text-[#a3b0aa] font-medium hover:text-white transition cursor-pointer">Assistant</button>
        <button onclick="setScreen('screens/11_analytics.html')" class="screen-btn px-3 py-1.5 rounded-md bg-[#17221d] text-[#a3b0aa] font-medium hover:text-white transition cursor-pointer">Analytics</button>
        <button onclick="setScreen('screens/12_suppliers.html')" class="screen-btn px-3 py-1.5 rounded-md bg-[#17221d] text-[#a3b0aa] font-medium hover:text-white transition cursor-pointer">Suppliers</button>
        <button onclick="setScreen('screens/06_settings.html')" class="screen-btn px-3 py-1.5 rounded-md bg-[#17221d] text-[#a3b0aa] font-medium hover:text-white transition cursor-pointer">6. Settings</button>
      </div>

      <div class="flex items-center gap-2 shrink-0">
        <div class="inline-flex rounded-md border border-[#25362f] bg-[#17221d] p-0.5 text-[11px]">
          <button onclick="setViewport('mobile')" id="vp-mobile" class="px-2.5 py-1 rounded bg-[#0f382b] text-white font-semibold cursor-pointer">Mobile</button>
          <button onclick="setViewport('desktop')" id="vp-desktop" class="px-2.5 py-1 rounded text-[#a3b0aa] font-medium cursor-pointer">Desktop</button>
        </div>
        <a id="open-new-tab" href="screens/01_signin.html" target="_blank" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-md bg-[#0f382b] text-xs text-[#edf1ee] font-semibold hover:bg-[#174c3b] transition">
          <span>Full View</span>
          <span class="material-symbols-outlined text-[15px]">open_in_new</span>
        </a>
      </div>
    </div>
  </div>

  <!-- Viewport Simulator Frame -->
  <main class="w-full max-w-7xl flex justify-center pb-8">
    <div id="vp-frame" class="relative w-[390px] h-[820px] rounded-[36px] p-2.5 bg-[#080c0a] border-2 border-[#25362f] shadow-2xl flex flex-col overflow-hidden transition-all duration-300">
      <iframe id="stitch-viewport" src="screens/01_signin.html" class="w-full h-full rounded-[26px] bg-[#faf8f5] border-0 overflow-y-auto"></iframe>
    </div>
  </main>

  <script>
    async function setScreen(url) {
      if (url.includes('01_signin.html')) {
        const token = localStorage.getItem('smartstock_token');
        if (token) {
          try {
            fetch('http://localhost:8000/api/v1/auth/logout', {
              method: 'POST',
              headers: { 'Authorization': 'Bearer ' + token },
              keepalive: true
            }).catch(() => {});
          } catch (e) {}
        }
        try {
          const preserve = new Set(['smartstock_theme', 'smartstock_intelligence_mode', 'smartstock_production_mode']);
          const toRemove = [];
          for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (k && k.startsWith('smartstock_') && !preserve.has(k)) {
              toRemove.push(k);
            }
          }
          toRemove.forEach(k => localStorage.removeItem(k));
          sessionStorage.clear();
        } catch (e) {}
      }
      document.getElementById('stitch-viewport').src = url;
      document.getElementById('open-new-tab').href = url;
      document.querySelectorAll('.screen-btn').forEach(btn => {
        if (btn.getAttribute('onclick').includes(url)) {
          btn.className = 'screen-btn px-3 py-1.5 rounded-md bg-[#0f382b] text-[#edf1ee] font-semibold transition cursor-pointer';
        } else {
          btn.className = 'screen-btn px-3 py-1.5 rounded-md bg-[#17221d] text-[#a3b0aa] font-medium hover:text-white transition cursor-pointer';
        }
      });
    }

    function setViewport(mode) {
      const frame = document.getElementById('vp-frame');
      const iframe = document.getElementById('stitch-viewport');
      const btnM = document.getElementById('vp-mobile');
      const btnD = document.getElementById('vp-desktop');
      if (mode === 'desktop') {
        frame.className = 'relative w-full h-[820px] rounded-xl p-1.5 bg-[#080c0a] border border-[#25362f] shadow-2xl flex flex-col overflow-hidden transition-all duration-300';
        iframe.className = 'w-full h-full rounded-lg bg-[#faf8f5] border-0 overflow-y-auto';
        btnD.className = 'px-2.5 py-1 rounded bg-[#0f382b] text-white font-semibold cursor-pointer';
        btnM.className = 'px-2.5 py-1 rounded text-[#a3b0aa] font-medium cursor-pointer';
      } else {
        frame.className = 'relative w-[390px] h-[820px] rounded-[36px] p-2.5 bg-[#080c0a] border-2 border-[#25362f] shadow-2xl flex flex-col overflow-hidden transition-all duration-300';
        iframe.className = 'w-full h-full rounded-[26px] bg-[#faf8f5] border-0 overflow-y-auto';
        btnM.className = 'px-2.5 py-1 rounded bg-[#0f382b] text-white font-semibold cursor-pointer';
        btnD.className = 'px-2.5 py-1 rounded text-[#a3b0aa] font-medium cursor-pointer';
      }
    }
  </script>
</body>
</html>
