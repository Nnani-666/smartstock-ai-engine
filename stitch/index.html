<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartStock — Stitch Frontend & Supabase Integration</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <style>
    body { font-family: 'Hanken Grotesk', sans-serif; background-color: #121815; color: #ebefea; }
    .serif { font-family: 'Newsreader', serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 md:p-8">

  <!-- Top Status Bar -->
  <header class="w-full max-w-5xl flex flex-wrap items-center justify-between pb-6 border-b border-[#24483d] gap-4">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-[#24483d] flex items-center justify-center text-[#c3ebdc] shadow-md">
        <span class="material-symbols-outlined text-[24px]">inventory_2</span>
      </div>
      <div>
        <h1 class="serif text-2xl font-bold tracking-tight text-[#f6faf5]">SmartStock AI Suite</h1>
        <p class="text-xs text-[#a8cfc0]">Sharma Kirana Retail OS (₹ INR) • Stitch UI ↔ Supabase Backend</p>
      </div>
    </div>

    <!-- Live Status Badges -->
    <div class="flex items-center gap-3">
      <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-[#1b362e] border border-[#24483d] text-xs">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span class="text-emerald-200 mono">Supabase: txpvoqdecsjpmklelxdb</span>
      </div>
      <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-[#1b362e] border border-[#24483d] text-xs">
        <span class="w-2 h-2 rounded-full bg-teal-400"></span>
        <span class="text-teal-200 mono">Stitch: 776996957008142928</span>
      </div>
    </div>
  </header>

  <!-- Interactive Controls & Screen Switcher -->
  <div class="w-full max-w-5xl flex flex-wrap items-center justify-between py-6 gap-3">
    <div class="flex flex-wrap gap-2 text-xs">
      <button onclick="setScreen('screens/01_signin.html')" class="screen-btn px-4 py-2 rounded-lg bg-[#24483d] text-[#c3ebdc] font-semibold hover:bg-[#2d584b] transition">
        1. Sign In
      </button>
      <button onclick="setScreen('screens/02_overview.html')" class="screen-btn px-4 py-2 rounded-lg bg-[#18231e] text-[#a6b1a7] font-semibold hover:bg-[#24483d] transition">
        2. Overview
      </button>
      <button onclick="setScreen('screens/03_inventory.html')" class="screen-btn px-4 py-2 rounded-lg bg-[#18231e] text-[#a6b1a7] font-semibold hover:bg-[#24483d] transition">
        3. Inventory
      </button>
      <button onclick="setScreen('screens/04_forecasts.html')" class="screen-btn px-4 py-2 rounded-lg bg-[#18231e] text-[#a6b1a7] font-semibold hover:bg-[#24483d] transition">
        4. Forecasts
      </button>
      <button onclick="setScreen('screens/05_purchase_orders.html')" class="screen-btn px-4 py-2 rounded-lg bg-[#18231e] text-[#a6b1a7] font-semibold hover:bg-[#24483d] transition">
        5. Purchase Orders
      </button>
      <button onclick="setScreen('screens/06_settings.html')" class="screen-btn px-4 py-2 rounded-lg bg-[#18231e] text-[#a6b1a7] font-semibold hover:bg-[#24483d] transition">
        6. Settings
      </button>
    </div>

    <a id="open-new-tab" href="screens/01_signin.html" target="_blank" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-[#24483d]/60 text-xs text-[#c3ebdc] hover:bg-[#24483d] transition">
      <span>Open in full view</span>
      <span class="material-symbols-outlined text-[16px]">open_in_new</span>
    </a>
  </div>

  <!-- Mobile Viewport Simulator -->
  <main class="w-full flex justify-center pb-12">
    <div class="relative w-[390px] h-[844px] rounded-[44px] p-3 bg-[#0d1310] border-4 border-[#2d3a33] shadow-[0_25px_60px_-15px_rgba(0,0,0,0.7)] flex flex-col overflow-hidden">
      <!-- Phone Notch / Island -->
      <div class="absolute top-4 left-1/2 -translate-x-1/2 w-28 h-4 bg-black rounded-full z-30"></div>
      
      <!-- Screen Iframe -->
      <iframe id="stitch-viewport" src="screens/01_signin.html" class="w-full h-full rounded-[34px] bg-[#f6faf5] border-0 overflow-y-auto"></iframe>
    </div>
  </main>

  <script>
    function setScreen(url) {
      document.getElementById('stitch-viewport').src = url;
      document.getElementById('open-new-tab').href = url;
      
      document.querySelectorAll('.screen-btn').forEach(btn => {
        if (btn.getAttribute('onclick').includes(url)) {
          btn.className = 'screen-btn px-4 py-2 rounded-lg bg-[#24483d] text-[#c3ebdc] font-semibold hover:bg-[#2d584b] transition';
        } else {
          btn.className = 'screen-btn px-4 py-2 rounded-lg bg-[#18231e] text-[#a6b1a7] font-semibold hover:bg-[#24483d] transition';
        }
      });
    }
  </script>
</body>
</html>
