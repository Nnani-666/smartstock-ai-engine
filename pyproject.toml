[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=app --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
ignore = ["BLE001", "B008", "ASYNC230", "RUF046", "UP017", "FURB162", "S110"]

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*"]
