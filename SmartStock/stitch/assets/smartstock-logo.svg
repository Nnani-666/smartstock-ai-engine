<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Rich Deep Pine to Midnight Emerald -->
    <radialGradient id="bgGlow" cx="50%" cy="46%" r="65%">
      <stop offset="0%" stop-color="#0c3f32" />
      <stop offset="55%" stop-color="#072b22" />
      <stop offset="100%" stop-color="#031611" />
    </radialGradient>

    <!-- Core Ambient Luminous Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#0b3127" stop-opacity="0" />
    </radialGradient>

    <!-- 3D Cube Gradients -->
    <linearGradient id="topFaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#248a6d" />
      <stop offset="100%" stop-color="#145b47" />
    </linearGradient>

    <linearGradient id="leftFaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d4738" />
      <stop offset="100%" stop-color="#06261e" />
    </linearGradient>

    <linearGradient id="rightFaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a3a2e" />
      <stop offset="100%" stop-color="#041b15" />
    </linearGradient>

    <!-- Dynamic S-Arrow Ribbon Gradient: Terracotta to Amber Gold -->
    <linearGradient id="arrowGrad" x1="10%" y1="90%" x2="90%" y2="10%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Ribbon Depth Gradient for Underside -->
    <linearGradient id="ribbonUnderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a3412" />
      <stop offset="100%" stop-color="#431407" />
    </linearGradient>

    <filter id="ribbonShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="starGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#fef08a" flood-opacity="0.95" />
    </filter>
  </defs>

  <!-- Solid Square Background (Apple App Store / iOS Standard) -->
  <rect width="512" height="512" fill="url(#bgGlow)" />
  <circle cx="256" cy="256" r="190" fill="url(#coreGlow)" />

  <!-- Ground Ambient Contact Shadow -->
  <ellipse cx="256" cy="425" rx="145" ry="34" fill="#000000" opacity="0.5" filter="blur(6px)" />

  <!-- 3D Isometric Retail / Storage Crate -->
  <g id="isometric-crate">
    <!-- Top Face -->
    <polygon points="256,128 384,200 256,272 128,200" fill="url(#topFaceGrad)" stroke="#34d399" stroke-opacity="0.3" stroke-width="1.5" />

    <!-- Left Face -->
    <polygon points="128,200 256,272 256,400 128,328" fill="url(#leftFaceGrad)" stroke="#059669" stroke-opacity="0.2" stroke-width="1.5" />

    <!-- Right Face -->
    <polygon points="256,272 384,200 384,328 256,400" fill="url(#rightFaceGrad)" stroke="#059669" stroke-opacity="0.2" stroke-width="1.5" />

    <!-- Isometric Slats & Grooves -->
    <line x1="128" y1="264" x2="256" y2="336" stroke="#000000" stroke-opacity="0.4" stroke-width="2" />
    <line x1="128" y1="266" x2="256" y2="338" stroke="#34d399" stroke-opacity="0.15" stroke-width="1" />
    <line x1="256" y1="336" x2="384" y2="264" stroke="#000000" stroke-opacity="0.4" stroke-width="2" />
    <line x1="256" y1="338" x2="384" y2="266" stroke="#34d399" stroke-opacity="0.15" stroke-width="1" />

    <!-- Center Spine Highlight -->
    <line x1="256" y1="272" x2="256" y2="400" stroke="#34d399" stroke-opacity="0.3" stroke-width="2" />
  </g>

  <!-- Modern Geometric "S" Monogram Ribbon Flowing Through Crate -->
  <g id="smartstock-monogram-s" filter="url(#ribbonShadow)">
    <!-- Underside Ribbon (gives 3D twisting depth) -->
    <path d="M 185,250 C 150,225 155,185 205,170 C 265,152 300,195 330,230 L 358,212 C 322,170 270,126 190,148 C 120,168 115,230 162,272 Z" fill="url(#ribbonUnderGrad)" opacity="0.85" />

    <!-- Upper Loop of S -->
    <path d="M 190,148 C 270,126 322,170 358,212 L 330,230 C 300,195 265,152 205,170 C 155,185 150,225 185,250 L 162,272 C 115,230 120,168 190,148 Z" fill="url(#arrowGrad)" />

    <!-- Diagonal Spine & Lower Loop of S with Ascending Arrow -->
    <path d="M 185,250 
             C 240,290 280,315 280,350 
             C 280,380 250,395 210,390 
             C 170,385 145,360 135,335 
             L 105,348 
             C 120,385 155,420 215,425 
             C 275,430 318,398 318,342 
             C 318,290 265,260 215,225 
             L 240,202 
             C 285,235 340,265 375,220 
             C 395,195 410,165 418,135 
             L 445,158 
             L 435,95 
             L 375,115 
             L 398,135 
             C 388,160 372,185 352,205 
             C 320,240 275,215 235,185 Z" 
          fill="url(#arrowGrad)" />

    <!-- White Glint Ridge on Upper Spine -->
    <path d="M 200,160 C 255,142 295,175 330,215" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.75" stroke-linecap="round" />
    <path d="M 130,345 C 145,380 185,410 230,412" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.6" stroke-linecap="round" />
    <path d="M 235,215 C 275,245 330,270 365,225 C 385,200 405,160 415,130" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.8" stroke-linecap="round" />
  </g>

  <!-- AI Intelligence Starburst at Arrow Peak -->
  <g transform="translate(435, 95)" filter="url(#starGlow)">
    <path d="M 0,-26 Q 0,0 26,0 Q 0,0 0,26 Q 0,0 -26,0 Q 0,0 0,-26 Z" fill="#ffffff" />
    <circle cx="0" cy="0" r="4.5" fill="#fef08a" />
  </g>

  <!-- Ambient Micro Sparkles -->
  <g transform="translate(108, 175) scale(0.55)">
    <path d="M 0,-18 Q 0,0 18,0 Q 0,0 0,18 Q 0,0 -18,0 Q 0,0 0,-18 Z" fill="#ffffff" opacity="0.85" />
  </g>
  <g transform="translate(395, 385) scale(0.45)">
    <path d="M 0,-16 Q 0,0 16,0 Q 0,0 0,16 Q 0,0 -16,0 Q 0,0 0,-16 Z" fill="#fef08a" opacity="0.9" />
  </g>
</svg>
